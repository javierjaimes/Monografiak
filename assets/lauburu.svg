<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21 -21 42 42">
  <!-- Lauburu: four comma-shaped heads, the traditional Basque cross. -->
  <symbol id="lauburu" viewBox="-21 -21 42 42">
    <g fill="currentColor">
      <path id="arm" d="M0 0 A10 10 0 0 1 0 -20 A5 5 0 0 1 0 -10 A5 5 0 0 0 0 0 Z"/>
      <use href="#arm" transform="rotate(90)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(270)"/>
    </g>
  </symbol>
  <use href="#lauburu" width="42" height="42" x="-21" y="-21" style="color:#c8102e"/>
</svg>
