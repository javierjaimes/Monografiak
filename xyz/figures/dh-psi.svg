<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Message flow of Diffie–Hellman private set intersection</title>
  <desc id="d">Alice holds set X and secret exponent a; Bob holds set Y and secret exponent b. Step 1: Alice sends H(x) raised to a for each x in X. Step 2: Bob returns those values raised to b, in the same order, plus H(y) raised to b for each y in Y, shuffled. Step 3: Alice raises Bob's values to a and compares the two lists of double-blinded values; matches reveal the intersection.</desc>
  <style>
    :root { --ink: #161616; --muted: #595959; --accent: #b3121f; --rule: #dcd8d0; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ece9e3; --muted: #a8a49c; --accent: #ff8a7a; --rule: #3a3936; }
    }
    text { font-family: "Iowan Old Style", Charter, Georgia, serif; fill: var(--ink); }
    .m { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: italic; }
    .h { font-size: 22px; font-weight: 600; }
    .s { font-size: 15px; fill: var(--muted); }
    .lbl { font-size: 17px; }
    .n { font-size: 13px; fill: var(--accent); font-weight: 600; letter-spacing: .06em; }
    .life { stroke: var(--rule); stroke-width: 2; }
    .arr { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .head { fill: var(--ink); }
    .box { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>

  <!-- Parties -->
  <text x="110" y="36" text-anchor="middle" class="h">Alice</text>
  <text x="110" y="58" text-anchor="middle" class="s">set <tspan class="m">X</tspan>, secret <tspan class="m">a</tspan></text>
  <text x="610" y="36" text-anchor="middle" class="h">Bob</text>
  <text x="610" y="58" text-anchor="middle" class="s">set <tspan class="m">Y</tspan>, secret <tspan class="m">b</tspan></text>

  <line x1="110" y1="74" x2="110" y2="380" class="life"/>
  <line x1="610" y1="74" x2="610" y2="380" class="life"/>

  <!-- Step 1 -->
  <text x="360" y="112" text-anchor="middle" class="n">STEP 1</text>
  <text x="360" y="136" text-anchor="middle" class="lbl m">H(x)ᵃ   for every x ∈ X</text>
  <line x1="120" y1="152" x2="600" y2="152" class="arr" marker-end="url(#ah)"/>

  <!-- Step 2 -->
  <text x="360" y="196" text-anchor="middle" class="n">STEP 2</text>
  <text x="360" y="220" text-anchor="middle" class="lbl m">(H(x)ᵃ)ᵇ  in order,   H(y)ᵇ  shuffled</text>
  <line x1="600" y1="236" x2="120" y2="236" class="arr" marker-end="url(#ah)"/>

  <!-- Step 3 -->
  <text x="140" y="284" class="n">STEP 3 · LOCAL</text>
  <rect x="130" y="296" width="460" height="64" rx="4" class="box"/>
  <text x="360" y="322" text-anchor="middle" class="lbl">compute <tspan class="m">(H(y)ᵇ)ᵃ</tspan> and compare with <tspan class="m">H(x)ᵃᵇ</tspan></text>
  <text x="360" y="346" text-anchor="middle" class="s">equal values mark elements of <tspan class="m">X ∩ Y</tspan></text>
</svg>
